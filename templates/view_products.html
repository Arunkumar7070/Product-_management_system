<!DOCTYPE html>
<html>
    <head>
        <title>View Products</title>
    </head>
    <body>
        <h1>Products</h1>
        <table border="1">
            <tr>
                <th>Name</th>
                <th>price</th>
                <th>quantity</th>
            </tr>
            {% for p in products %}
            <tr>
                <td>{{ p[1] }}</td>
                <td>{{ p[2] }}</td>
                <td>{{ p[3]}}</td>
            </tr>
            {% endfor %}
        </table>
        <p><a href="http://127.0.0.1:5001/">Back to Product Home Page</a></p>

    </body>
</html>
